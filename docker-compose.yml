version: "3.8"

services:
  v2ray-analyzer:
    build: .
    image: v2ray-analyzer:latest
    container_name: v2ray-analyzer
    restart: unless-stopped
    ports:
      - "8848:8848"
    volumes:
      # 将 VPS 上 V2Ray 日志目录挂载到容器内
      # 如果您的 V2Ray 日志在其他路径（如 /var/log/v2ray），请修改冒号左侧
      - ./logs:/logs:ro
      # 持久化存储 SQLite 数据库与设备别名
      - ./data:/data
    environment:
      - PORT=8848
      - LOG_DIR=/logs
      - ACCESS_LOG_PATH=/logs/access.log
      - DB_PATH=/data/v2ray_stats.db
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=changeme888
